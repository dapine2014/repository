spring.application.name=repository
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID}
spring.kafka.producer.retries=${SPRING_KAFKA_PRODUCER_RETRIES:1}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
app.kafka.topic.repository-query=REPOSITORY_QUERY
app.kafka.topic.repository-response=REPOSITORY_RESPONSE
server.port=${PORT:8080}
server.servlet.context-path=/service
app.security.allow-inline-sensitive-config=${REPOSITORY_ALLOW_INLINE_SENSITIVE_CONFIG:false}

# Internal repository targets (use configRef/repositoryId from Kafka payload)
app.repository.targets.default.connector-id=${REPOSITORY_TARGET_DEFAULT_CONNECTOR:mongo}
app.repository.targets.default.config.uri=${REPOSITORY_TARGET_DEFAULT_URI:}
app.repository.targets.default.config.database=${REPOSITORY_TARGET_DEFAULT_DATABASE:}

# Swagger
springdoc.swagger-ui.path=/doc/swagger-ui.html
springdoc.api-docs.path=/doc/api-docs
springdoc.swagger-ui.enabled=true
