spring.application.name=repository
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID}

# Kafka TLS
spring.kafka.properties.security.protocol=SSL
spring.kafka.properties.ssl.truststore.location=${KAFKA_SSL_TRUSTSTORE_LOCATION:/etc/kafka/ssl/client.truststore.jks}
spring.kafka.properties.ssl.truststore.password=${KAFKA_SSL_TRUSTSTORE_PASSWORD:storm2026}
spring.kafka.properties.ssl.endpoint.identification.algorithm=
spring.kafka.producer.retries=${SPRING_KAFKA_PRODUCER_RETRIES:1}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Prefijo `staging.` para aislar del entorno `default` (mismo broker físico).
# DEBE coincidir con el prefijo en storm-api y storm-rules.
# Ver docs/STORM_CHANGELOG.md — "Aislamiento Kafka entre default y staging".
app.kafka.topic.repository-query=staging.REPOSITORY_QUERY
app.kafka.topic.repository-response=staging.REPOSITORY_RESPONSE
server.port=${PORT:8080}
server.servlet.context-path=/service
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
app.security.allow-inline-sensitive-config=${REPOSITORY_ALLOW_INLINE_SENSITIVE_CONFIG:true}

# Internal repository targets (use configRef/repositoryId from Kafka payload)
app.repository.targets.default.connector-id=${REPOSITORY_TARGET_DEFAULT_CONNECTOR:mongo}
app.repository.targets.default.config.uri=${REPOSITORY_TARGET_DEFAULT_URI:}
app.repository.targets.default.config.database=${REPOSITORY_TARGET_DEFAULT_DATABASE:}
